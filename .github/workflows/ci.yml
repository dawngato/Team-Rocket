name: HimVote validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest pydantic cryptography sqlalchemy fastapi httpx anyio aiosqlite web3 eth-account hexbytes
      - name: Run protocol and acceptance tests
        run: python tests/run_tests.py
      - name: Run service integration tests
        run: python -m pytest tests -q --tb=short
        working-directory: services/admin_api
      - run: python -m pytest tests -q --tb=short
        working-directory: services/anchor_relayer
      - run: python -m pytest tests -q --tb=short
        working-directory: services/casting
      - run: python -m pytest tests -q --tb=short
        working-directory: services/checkpoint_worker

  web:
    name: Web unit and production checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  linux:
    name: Linux desktop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux desktop test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run Linux client tests
        run: xvfb-run -a python3 -m pytest apps/linux/tests -q

  browser:
    name: Browser acceptance smoke
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run dev -- --port 3100 > /tmp/himvote-web.log 2>&1 & sleep 5
      - run: python tests/browser_smoke.py

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: ./gradlew test

  ios:
    name: iOS unit tests
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  windows:
    name: Windows desktop tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test apps/desktop/HimVote.Windows.sln --configuration Release
