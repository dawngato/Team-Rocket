name: HimVote EC2 Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 Server
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets
        run: |
          DEPLOY_KEY="${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.EC2_PRIVATE_KEY }}"
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::EC2_SSH_KEY secret is not configured in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Deployment secrets validated successfully."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || '13.232.47.32' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.EC2_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            APP_DIR="/opt/himvote"
            sudo chown -R $USER:$USER "$APP_DIR" 2>/dev/null || true
            git config --global --add safe.directory "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repository not found at $APP_DIR. Running initial setup..."
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:$USER "$APP_DIR"
              git clone https://github.com/dawngato/Team-Rocket.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            echo "Pulling latest changes from main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "Rebuilding and restarting services..."
            docker compose -f compose.yaml -f compose.dev.yaml up -d --build --remove-orphans
            
            echo "Checking container status..."
            docker compose ps
