# HimVote Production Compose Configuration
# Production single host topology with hardened security, resource limits, and log rotation
# Applied via: docker compose -f compose.yaml -f compose.prod.yaml up -d

services:
  gateway:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      GATEWAY_TLS_ENABLED: "true"
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    restart: always
    ports: []
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DEV_MODE: "false"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  admin_api:
    restart: always
    ports: []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: info
      LOG_REDACTION_ENABLED: "true"
      ALLOW_DEV_ACTOR_HEADERS: "false"
      ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:?Set ADMIN_ALLOWED_ORIGINS to trusted HTTPS origins}
      ADMIN_DB_URL: ${ADMIN_DATABASE_URL:?Set ADMIN_DATABASE_URL to the managed admin database URL}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:?Set IDENTITY_SERVICE_URL to the identity issuer}
      PINNED_AUDITOR_PUBLIC_KEY: ${PINNED_AUDITOR_PUBLIC_KEY:?Set PINNED_AUDITOR_PUBLIC_KEY}
      ADMIN_SCHEMA_VERSION: ${ADMIN_SCHEMA_VERSION:?Set ADMIN_SCHEMA_VERSION after applying admin migrations}
      REQUIRE_ESTABLISHED_ENGINE_TALLY: "true"
      IDENTITY_DB_SSL_MODE: verify-full
      CASTING_DB_SSL_MODE: verify-full
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  identity_issuer:
    restart: always
    ports: []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: info
      LOG_REDACTION_ENABLED: "true"
      BOOTSTRAP_ALLOWED: "false"
      IDENTITY_ALLOWED_ORIGINS: ${IDENTITY_ALLOWED_ORIGINS:?Set IDENTITY_ALLOWED_ORIGINS to trusted HTTPS origins}
      DATABASE_URL: ${IDENTITY_DATABASE_URL:?Set IDENTITY_DATABASE_URL to the managed identity database URL}
      ISSUER_PRIVATE_KEY_PEM: ${ISSUER_PRIVATE_KEY_PEM:?Set ISSUER_PRIVATE_KEY_PEM through the secret manager}
      IDENTITY_DB_SSL_MODE: verify-full
      KMS_PROVIDER: ${KMS_PROVIDER:-aws_kms}
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  casting:
    restart: always
    ports: []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: info
      LOG_REDACTION_ENABLED: "true"
      CASTING_DB_SSL_MODE: verify-full
      DATABASE_URL: ${CASTING_DATABASE_URL:?Set CASTING_DATABASE_URL to the managed casting database URL}
      ISSUER_PUBLIC_KEY_N: ${ISSUER_PUBLIC_KEY_N:?Set ISSUER_PUBLIC_KEY_N to the issuer public modulus}
      ISSUER_PUBLIC_KEY_E: ${ISSUER_PUBLIC_KEY_E:-65537}
      REQUIRE_ESTABLISHED_ENGINE: "true"
      ELECTION_ENGINE_BASE: http://election_engine:8084
      ENGINE_VALIDATION_MODE: remote
      CASTING_ALLOWED_ORIGINS: ${CASTING_ALLOWED_ORIGINS:?Set CASTING_ALLOWED_ORIGINS to trusted HTTPS origins}
      INTERNAL_CONTROL_TOKEN: ${CASTING_INTERNAL_CONTROL_TOKEN:?Set CASTING_INTERNAL_CONTROL_TOKEN in the secret manager}
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  election_engine:
    restart: always
    ports: []
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      VOTING_ENGINE_PROVIDER: ${VOTING_ENGINE_PROVIDER:?Set VOTING_ENGINE_PROVIDER to an established upstream provider}
      ENGINE_JOINT_PUBLIC_KEY: ${ENGINE_JOINT_PUBLIC_KEY:?Set ENGINE_JOINT_PUBLIC_KEY from the election key ceremony}
      ENGINE_ESTABLISHED: ${ENGINE_ESTABLISHED:-false}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  checkpoint_worker:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      LOG_REDACTION_ENABLED: "true"
      CASTING_DB_SSL_MODE: verify-full
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  witness:
    restart: always
    ports: []
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      LOG_REDACTION_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  anchor_relayer:
    restart: always
    environment:
      APP_ENV: production
      LOG_LEVEL: info
      LOG_REDACTION_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  chain_node:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  identity_db:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          cpus: "1.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  casting_db:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          cpus: "1.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  redis:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  certbot_data:
