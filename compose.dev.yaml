# HimVote Docker Compose Development Overrides
# Applied on top of compose.yaml via: docker compose -f compose.yaml -f compose.dev.yaml up

services:
  gateway:
    ports:
      - "80:80"
      - "443:443"

  web:
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_DEV_MODE=true
      - NEXT_PUBLIC_API_BASE=http://localhost:8080
      - NEXT_PUBLIC_IDENTITY_BASE=http://localhost:8080
      - NEXT_PUBLIC_CASTING_BASE=http://localhost:8080
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./apps/web/public:/app/public:ro

  admin_api:
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - LOG_LEVEL=debug
      - IDENTITY_DB_SSL_MODE=disable
      - CASTING_DB_SSL_MODE=disable
    volumes:
      - ./services/admin_api:/app:ro

  identity_issuer:
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - LOG_LEVEL=debug
      - IDENTITY_DB_SSL_MODE=disable
      - BOOTSTRAP_ALLOWED=true
      - KMS_PROVIDER=local
    volumes:
      - ./services/identity_issuer:/app:ro

  casting:
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - LOG_LEVEL=debug
      - CASTING_DB_SSL_MODE=disable
    volumes:
      - ./services/casting:/app:ro

  election_engine:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./services/election_engine:/app:ro

  checkpoint_worker:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - CASTING_DB_SSL_MODE=disable
    volumes:
      - ./services/checkpoint_worker:/app:ro

  witness:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - WITNESS_KEY_ID=local_witness_dev_key
    volumes:
      - ./witness:/app:ro

  anchor_relayer:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./services/anchor_relayer:/app:ro

  identity_db:
    ports:
      - "5432:5432"

  casting_db:
    ports:
      - "5433:5432"

  redis:
    command: ["redis-server"]
