# HimVote Docker Compose Development Overrides
# Applied on top of compose.yaml via: docker compose -f compose.yaml -f compose.dev.yaml up

services:
  gateway:
    ports:
      - "80:8080"
      - "443:8443"

  web:
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_DEV_MODE=true
      - NEXT_PUBLIC_API_BASE=http://localhost
      - NEXT_PUBLIC_IDENTITY_BASE=http://localhost
      - NEXT_PUBLIC_CASTING_BASE=http://localhost
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./apps/web/public:/app/public:ro

  admin_api:
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - LOG_LEVEL=debug
      - ADMIN_DB_URL=sqlite:////data/himvote_admin_development.db
      - IDENTITY_DB_SSL_MODE=disable
      - CASTING_DB_SSL_MODE=disable
    volumes:
      - ./services/admin_api:/app:ro
      - admin_api_data:/data

  identity_issuer:
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - LOG_LEVEL=debug
      - IDENTITY_DB_SSL_MODE=disable
      - BOOTSTRAP_ALLOWED=${BOOTSTRAP_ALLOWED:-false}
      - BOOTSTRAP_INVITATION_TOKEN=${BOOTSTRAP_INVITATION_TOKEN:-}
      - KMS_PROVIDER=local
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./services/identity_issuer:/app:ro

  casting:
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - LOG_LEVEL=debug
      - CASTING_DB_SSL_MODE=disable
      - ENGINE_VALIDATION_MODE=syntax_only
      - ELECTION_ENGINE_BASE=http://election_engine:8084
    volumes:
      - ./services/casting:/app:ro

  election_engine:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./services/election_engine:/app:ro

  checkpoint_worker:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - CASTING_DB_SSL_MODE=disable
    volumes:
      - ./services/checkpoint_worker:/app:ro

  witness:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - WITNESS_KEY_ID=local_witness_dev_key
    volumes:
      - ./witness:/app:ro

  anchor_relayer:
    environment:
      - APP_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./services/anchor_relayer:/app:ro

  identity_db:
    ports:
      - "5432:5432"

  casting_db:
    ports:
      - "5433:5432"

  redis:
    command: ["redis-server"]

volumes:
  admin_api_data:
