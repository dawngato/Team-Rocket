# HimVote Casting Database Alembic Configuration

[alembic]
script_location = infrastructure/migrations/casting
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+psycopg://himvote_casting:himvote_casting@localhost:5432/himvote_casting

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
