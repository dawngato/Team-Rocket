events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet_stream;

    sendfile on;
    keepalive_timeout 65;

    upstream identity_service {
        server identity_issuer:8081;
    }

    upstream casting_service {
        server casting:8082;
    }

    upstream admin_service {
        server admin_api:8083;
    }

    upstream witness_service {
        server witness:8086;
    }

    upstream web_service {
        server web:3000;
    }

    upstream engine_service {
        server election_engine:8084;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;

        location /healthz {
            access_log off;
            return 200 "OK\n";
        }

        # Identity Origin Endpoints
        location /v1/auth/ {
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        location /v1/bootstrap/ {
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        location /v1/students/ {
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        location /v1/roster/ {
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        location /v1/credentials/ {
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        location /v1/approvals/ {
            proxy_pass http://identity_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        # Admin Service Endpoints
        location /v1/admin/ {
            proxy_pass http://admin_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        location /v1/elections {
            proxy_pass http://admin_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        # Casting Origin Endpoints
        # Strip all identity session cookies and authentication headers
        location /v1/cast/ {
            proxy_pass http://casting_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X_Trace_ID "";
        }

        # Witness Service Endpoints
        location /checkpoints {
            proxy_pass http://witness_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        location /witness/ {
            proxy_pass http://witness_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        # Engine Booth Endpoints
        location /v1/engine/ {
            proxy_pass http://engine_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }

        # Frontend Web Application Default
        location / {
            proxy_pass http://web_service;
            proxy_set_header Host $host;
            proxy_set_header X_Real_IP $remote_addr;
            proxy_set_header X_Forwarded_For $proxy_add_x_forwarded_for;
        }
    }
}
