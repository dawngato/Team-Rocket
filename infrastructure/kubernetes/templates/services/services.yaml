apiVersion: v1
kind: Service
metadata:
  name: himvote-gateway
  namespace: himvote-edge
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: https
      port: 8443
      targetPort: 8443
  selector:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: himvote-web
  namespace: himvote-edge
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: web
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: web
---
apiVersion: v1
kind: Service
metadata:
  name: himvote-identity-issuer
  namespace: himvote-identity
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: identity-issuer
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: identity-issuer
---
apiVersion: v1
kind: Service
metadata:
  name: himvote-admin-api
  namespace: himvote-identity
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: admin-api
spec:
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  selector:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: admin-api
---
apiVersion: v1
kind: Service
metadata:
  name: himvote-redis
  namespace: himvote-identity
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: redis
---
apiVersion: v1
kind: Service
metadata:
  name: himvote-casting
  namespace: himvote-casting
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: casting
spec:
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: casting
---
apiVersion: v1
kind: Service
metadata:
  name: himvote-election-engine
  namespace: himvote-casting
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: election-engine
spec:
  ports:
    - name: http
      port: 8084
      targetPort: 8084
  selector:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: election-engine
---
apiVersion: v1
kind: Service
metadata:
  name: himvote-witness
  namespace: himvote-casting
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: witness
spec:
  ports:
    - name: http
      port: 8086
      targetPort: 8086
  selector:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: witness
