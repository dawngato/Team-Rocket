apiVersion: apps/v1
kind: Deployment
metadata:
  name: himvote-casting
  namespace: himvote-casting
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: casting
spec:
  replicas: {{ .Values.casting.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: himvote
      app.kubernetes.io/component: casting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: himvote
        app.kubernetes.io/component: casting
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: casting
          image: "{{ .Values.casting.image.repository }}:{{ .Values.casting.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: CASTING_DB_HOST
              value: {{ .Values.databases.casting.host | quote }}
            - name: CASTING_DB_PORT
              value: {{ .Values.databases.casting.port | quote }}
            - name: CASTING_DB_NAME
              value: {{ .Values.databases.casting.name | quote }}
            - name: CASTING_DB_USER
              value: {{ .Values.databases.casting.user | quote }}
            - name: CASTING_DB_SSL_MODE
              value: {{ .Values.databases.casting.sslMode | quote }}
            - name: ELECTION_ENGINE_BASE
              value: "http://himvote-election-engine:8084"
            - name: LOG_LEVEL
              value: {{ .Values.casting.env.logLevel | quote }}
            - name: LOG_REDACTION_ENABLED
              value: {{ .Values.casting.env.logRedactionEnabled | quote }}
            - name: CASTING_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: himvote-casting-secrets
                  key: database-password
          resources:
            {{- toYaml .Values.casting.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
