apiVersion: apps/v1
kind: Deployment
metadata:
  name: himvote-admin-api
  namespace: himvote-identity
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: admin-api
spec:
  replicas: {{ .Values.adminApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: himvote
      app.kubernetes.io/component: admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: himvote
        app.kubernetes.io/component: admin-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-api
          image: "{{ .Values.adminApi.image.repository }}:{{ .Values.adminApi.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: IDENTITY_DB_HOST
              value: {{ .Values.databases.identity.host | quote }}
            - name: IDENTITY_DB_PORT
              value: {{ .Values.databases.identity.port | quote }}
            - name: IDENTITY_DB_NAME
              value: {{ .Values.databases.identity.name | quote }}
            - name: IDENTITY_DB_USER
              value: {{ .Values.databases.identity.user | quote }}
            - name: IDENTITY_DB_SSL_MODE
              value: {{ .Values.databases.identity.sslMode | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.adminApi.env.logLevel | quote }}
            - name: LOG_REDACTION_ENABLED
              value: {{ .Values.adminApi.env.logRedactionEnabled | quote }}
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: himvote-identity-secrets
                  key: database-password
          resources:
            {{- toYaml .Values.adminApi.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
