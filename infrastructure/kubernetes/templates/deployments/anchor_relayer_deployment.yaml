{{- if .Values.anchorRelayer.env.workerEnabled }}
{{- $chainRpcUrl := required "anchorRelayer.env.chainRpcUrl is required when the anchoring worker is enabled" .Values.anchorRelayer.env.chainRpcUrl }}
{{- $chainId := required "anchorRelayer.env.chainId is required when the anchoring worker is enabled" .Values.anchorRelayer.env.chainId }}
{{- $contractAddress := required "anchorRelayer.env.contractAddress is required when the anchoring worker is enabled" .Values.anchorRelayer.env.contractAddress }}
{{- $witnessPublicKey := required "anchorRelayer.env.witnessPublicKey is required when the anchoring worker is enabled" .Values.anchorRelayer.env.witnessPublicKey }}
{{- $commitments := fromJson .Values.anchorRelayer.env.witnessElectionCommitments }}
{{- if not $commitments }}{{ fail "anchorRelayer.env.witnessElectionCommitments must be a non-empty JSON object when the anchoring worker is enabled" }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: himvote-anchor-relayer
  namespace: himvote-casting
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: anchor-relayer
spec:
  replicas: {{ .Values.anchorRelayer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: himvote
      app.kubernetes.io/component: anchor-relayer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: himvote
        app.kubernetes.io/component: anchor-relayer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anchor-relayer
          image: "{{ .Values.anchorRelayer.image.repository }}:{{ .Values.anchorRelayer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8087
          env:
            - name: WITNESS_BASE
              value: "http://himvote-witness:8086"
            - name: WITNESS_PUBLIC_KEY
              value: {{ .Values.anchorRelayer.env.witnessPublicKey | quote }}
            - name: WITNESS_ELECTION_COMMITMENTS
              value: {{ .Values.anchorRelayer.env.witnessElectionCommitments | quote }}
            - name: OUTBOX_DATABASE_PATH
              value: "/data/anchor_outbox.sqlite"
            - name: ANCHOR_WORKER_ENABLED
              value: {{ .Values.anchorRelayer.env.workerEnabled | toString | quote }}
            - name: CHAIN_RPC_URL
              value: {{ .Values.anchorRelayer.env.chainRpcUrl | quote }}
            - name: CHAIN_ID
              value: {{ .Values.anchorRelayer.env.chainId | quote }}
            - name: CHAIN_CONTRACT_ADDRESS
              value: {{ .Values.anchorRelayer.env.contractAddress | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.anchorRelayer.env.logLevel | quote }}
            - name: LOG_REDACTION_ENABLED
              value: {{ .Values.anchorRelayer.env.logRedactionEnabled | quote }}
            {{ if .Values.anchorRelayer.env.workerEnabled }}
            - name: RELAYER_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "anchorRelayer.env.privateKeySecretName is required when the anchoring worker is enabled" .Values.anchorRelayer.env.privateKeySecretName | quote }}
                  key: {{ required "anchorRelayer.env.privateKeySecretKey is required when the anchoring worker is enabled" .Values.anchorRelayer.env.privateKeySecretKey | quote }}
            {{ end }}
          resources:
            {{- toYaml .Values.anchorRelayer.resources | nindent 12 }}
          volumeMounts:
            - name: outbox-data
              mountPath: /data
      volumes:
        - name: outbox-data
          persistentVolumeClaim:
            claimName: himvote-anchor-relayer-outbox
