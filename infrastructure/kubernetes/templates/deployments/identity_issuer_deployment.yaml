apiVersion: apps/v1
kind: Deployment
metadata:
  name: himvote-identity-issuer
  namespace: himvote-identity
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: identity-issuer
spec:
  replicas: {{ .Values.identityIssuer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: himvote
      app.kubernetes.io/component: identity-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: himvote
        app.kubernetes.io/component: identity-issuer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-issuer
          image: "{{ .Values.identityIssuer.image.repository }}:{{ .Values.identityIssuer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: IDENTITY_DB_HOST
              value: {{ .Values.databases.identity.host | quote }}
            - name: IDENTITY_DB_PORT
              value: {{ .Values.databases.identity.port | quote }}
            - name: IDENTITY_DB_NAME
              value: {{ .Values.databases.identity.name | quote }}
            - name: IDENTITY_DB_USER
              value: {{ .Values.databases.identity.user | quote }}
            - name: IDENTITY_DB_SSL_MODE
              value: {{ .Values.databases.identity.sslMode | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.identityIssuer.env.logLevel | quote }}
            - name: LOG_REDACTION_ENABLED
              value: {{ .Values.identityIssuer.env.logRedactionEnabled | quote }}
            - name: BOOTSTRAP_ALLOWED
              value: {{ .Values.identityIssuer.env.bootstrapAllowed | quote }}
            - name: KMS_PROVIDER
              value: {{ .Values.identityIssuer.env.kmsProvider | quote }}
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: himvote-identity-secrets
                  key: database-password
          resources:
            {{- toYaml .Values.identityIssuer.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
