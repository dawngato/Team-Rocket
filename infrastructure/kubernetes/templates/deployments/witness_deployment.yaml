apiVersion: apps/v1
kind: Deployment
metadata:
  name: himvote-witness
  namespace: himvote-casting
  labels:
    app.kubernetes.io/name: himvote
    app.kubernetes.io/component: witness
spec:
  replicas: {{ .Values.witness.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: himvote
      app.kubernetes.io/component: witness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: himvote
        app.kubernetes.io/component: witness
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: witness
          image: "{{ .Values.witness.image.repository }}:{{ .Values.witness.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: LOG_LEVEL
              value: {{ .Values.witness.env.logLevel | quote }}
            - name: LOG_REDACTION_ENABLED
              value: {{ .Values.witness.env.logRedactionEnabled | quote }}
          resources:
            {{- toYaml .Values.witness.resources | nindent 12 }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
