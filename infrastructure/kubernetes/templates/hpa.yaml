{{- if .Values.casting.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: himvote-casting-hpa
  namespace: himvote-casting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: himvote-casting
  minReplicas: {{ .Values.casting.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.casting.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.casting.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
