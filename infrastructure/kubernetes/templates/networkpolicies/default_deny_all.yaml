# Default Deny All Ingress and Egress for Edge Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: himvote-edge
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Default Deny All Ingress and Egress for Identity Namespace
apiVersion: networking.k8s.io/v1
