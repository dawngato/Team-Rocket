# HimVote Docker Compose Configuration
# Production grade microservices topology for institutional elections
# Enforces strict network separation between identity and casting domains

services:
  gateway:
    image: nginx:1.25-alpine
    container_name: himvote_gateway
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - admin_api
      - identity_issuer
      - casting
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - himvote_frontend
      - himvote_identity_net
      - himvote_casting_net
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: himvote_web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8080
      - NEXT_PUBLIC_IDENTITY_BASE=http://localhost:8080
      - NEXT_PUBLIC_CASTING_BASE=http://localhost:8080
    depends_on:
      - identity_issuer
      - casting
    networks:
      - himvote_frontend
      - himvote_identity_net
    restart: unless-stopped

  admin_api:
    build:
      context: ./services/admin_api
      dockerfile: Dockerfile
    container_name: himvote_admin_api
    environment:
      - ADMIN_DB_URL=sqlite:///./himvote_admin_development.db
      - IDENTITY_SERVICE_URL=http://identity_issuer:8081
      - LOG_LEVEL=info
      - LOG_REDACTION_ENABLED=true
      - IDENTITY_ALLOWED_ORIGINS=${IDENTITY_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - AUDITOR_PUBLIC_KEY_FINGERPRINT=${AUDITOR_PUBLIC_KEY_FINGERPRINT:-CHANGE_ME}
    depends_on:
      identity_issuer:
        condition: service_started
    networks:
      - himvote_identity_net
    restart: unless-stopped

  identity_issuer:
    build:
      context: ./services/identity_issuer
      dockerfile: Dockerfile
    container_name: himvote_identity_issuer
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - IDENTITY_DB_HOST=identity_db
      - IDENTITY_DB_PORT=5432
      - IDENTITY_DB_NAME=himvote_identity
      - IDENTITY_DB_USER=himvote_identity
      - IDENTITY_DB_PASSWORD=${IDENTITY_DB_PASSWORD:-himvote_dev_identity_pw}
      - IDENTITY_DB_SSL_MODE=prefer
      - KMS_PROVIDER=local
      - LOG_LEVEL=info
      - LOG_REDACTION_ENABLED=true
      - BOOTSTRAP_ALLOWED=${BOOTSTRAP_ALLOWED:-true}
    depends_on:
      identity_db:
        condition: service_healthy
    networks:
      - himvote_identity_net
    restart: unless-stopped

  casting:
    build:
      context: ./services/casting
      dockerfile: Dockerfile
    container_name: himvote_casting
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - CASTING_DB_HOST=casting_db
      - CASTING_DB_PORT=5432
      - CASTING_DB_NAME=himvote_casting
      - CASTING_DB_USER=himvote_casting
      - CASTING_DB_PASSWORD=${CASTING_DB_PASSWORD:-himvote_dev_casting_pw}
      - CASTING_DB_SSL_MODE=prefer
      - ELECTION_ENGINE_BASE=http://election_engine:8084
      - LOG_LEVEL=info
      - LOG_REDACTION_ENABLED=true
      - CASTING_ALLOWED_ORIGINS=${CASTING_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      casting_db:
        condition: service_healthy
      election_engine:
        condition: service_started
    networks:
      - himvote_casting_net
    restart: unless-stopped

  election_engine:
    build:
      context: ./services/election_engine
      dockerfile: Dockerfile
    container_name: himvote_election_engine
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - LOG_LEVEL=info
      - VOTING_ENGINE_PROVIDER=custom_development_unverified
    networks:
      - himvote_casting_net
    restart: unless-stopped

  checkpoint_worker:
    build:
      context: ./services/checkpoint_worker
      dockerfile: Dockerfile
    container_name: himvote_checkpoint_worker
    environment:
      - CASTING_DB_HOST=casting_db
      - CASTING_DB_PORT=5432
      - CASTING_DB_NAME=himvote_casting
      - CASTING_DB_USER=himvote_casting
      - CASTING_DB_PASSWORD=${CASTING_DB_PASSWORD:-himvote_dev_casting_pw}
      - WITNESS_BASE=http://witness:8086
      - LOG_LEVEL=info
      - LOG_REDACTION_ENABLED=true
    depends_on:
      casting_db:
        condition: service_healthy
      witness:
        condition: service_started
    networks:
      - himvote_casting_net
    restart: unless-stopped

  witness:
    build:
      context: ./witness
      dockerfile: Dockerfile
    container_name: himvote_witness
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      - LOG_LEVEL=info
      - LOG_REDACTION_ENABLED=true
      - WITNESS_KEY_ID=local_witness_key
    networks:
      - himvote_casting_net
    restart: unless-stopped

  anchor_relayer:
    build:
      context: ./services/anchor_relayer
      dockerfile: Dockerfile
    container_name: himvote_anchor_relayer
    environment:
      - WITNESS_BASE=http://witness:8086
      - CHAIN_RPC_URL=http://chain_node:8545
      - CHAIN_ID=31337
      - CHAIN_CONTRACT_ADDRESS=${CHAIN_CONTRACT_ADDRESS:-CHANGE_ME}
      - LOG_LEVEL=info
      - LOG_REDACTION_ENABLED=true
    depends_on:
      witness:
        condition: service_started
      chain_node:
        condition: service_healthy
    networks:
      - himvote_casting_net
    restart: unless-stopped

  chain_node:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: himvote_chain_node
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - himvote_casting_net
    restart: unless-stopped

  identity_db:
    image: postgres:16-alpine
    container_name: himvote_identity_db
    environment:
      - POSTGRES_DB=himvote_identity
      - POSTGRES_USER=himvote_identity
      - POSTGRES_PASSWORD=${IDENTITY_DB_PASSWORD:-himvote_dev_identity_pw}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - identity_db_data:/var/lib/postgresql/data
      - ./infrastructure/migrations/identity/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himvote_identity -d himvote_identity"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - himvote_identity_net
    restart: unless-stopped

  casting_db:
    image: postgres:16-alpine
    container_name: himvote_casting_db
    environment:
      - POSTGRES_DB=himvote_casting
      - POSTGRES_USER=himvote_casting
      - POSTGRES_PASSWORD=${CASTING_DB_PASSWORD:-himvote_dev_casting_pw}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - casting_db_data:/var/lib/postgresql/data
      - ./infrastructure/migrations/casting/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U himvote_casting -d himvote_casting"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - himvote_casting_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: himvote_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-himvote_dev_redis_pw}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-himvote_dev_redis_pw}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - himvote_identity_net
    restart: unless-stopped

networks:
  himvote_frontend:
    driver: bridge
  himvote_identity_net:
    driver: bridge
    internal: false
  himvote_casting_net:
    driver: bridge
    internal: false

volumes:
  identity_db_data:
  casting_db_data:
  redis_data:
