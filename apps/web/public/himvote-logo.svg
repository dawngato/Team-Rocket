<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan to Navy Tech Gradient -->
    <linearGradient id="techCyanNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0E2A47" />
    </linearGradient>

    <!-- Himalayan Mountain Gradients -->
    <linearGradient id="peakGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F1FF" />
      <stop offset="40%" stop-color="#80C8F8" />
      <stop offset="100%" stop-color="#1B4975" />
    </linearGradient>
    <linearGradient id="peakGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A5DBFD" />
      <stop offset="100%" stop-color="#103358" />
    </linearGradient>
    <linearGradient id="peakGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Isometric Ballot Box Gradients -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2D4E" />
      <stop offset="100%" stop-color="#091A2E" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164475" />
      <stop offset="100%" stop-color="#0C2542" />
    </linearGradient>

    <!-- Saffron Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>

    <!-- Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0D5C05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- BACKGROUND: Subtle Tech Geometric Container / Shield -->
  <rect width="512" height="512" rx="108" fill="#07111E" />
  
  <!-- Subtle Ambient Glow Behind Peaks -->
  <circle cx="256" cy="230" r="140" fill="#00D2FF" opacity="0.08" filter="url(#softGlow)" />

  <!-- CIRCUIT TRACE LINES & TECH NODES -->
  <g stroke="#00D2FF" stroke-width="2.5" opacity="0.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80 280 L 130 280 L 170 320 L 210 320" />
    <path d="M 120 180 L 160 180 L 195 215" />
    <path d="M 432 280 L 382 280 L 342 320 L 302 320" />
    <path d="M 392 180 L 352 180 L 317 215" />
    <path d="M 256 60 L 256 95" />
  </g>
  <g fill="#00E5FF" opacity="0.7">
    <circle cx="80" cy="280" r="4.5" />
    <circle cx="120" cy="180" r="4" />
    <circle cx="432" cy="280" r="4.5" />
    <circle cx="392" cy="180" r="4" />
    <circle cx="256" cy="60" r="4.5" />
  </g>

  <!-- HIMALAYAN MOUNTAIN PEAKS (Geometric, Modern, Layered) -->
  <g id="himalayan-peaks">
    <!-- Back Peak (Right) -->
    <polygon points="320,110 410,270 260,270" fill="url(#peakGradRight)" opacity="0.85" />
    <polygon points="320,110 410,270 340,270" fill="#0C2542" opacity="0.4" />
    <!-- Back Peak Snowcap Right -->
    <polygon points="320,110 345,155 330,165 310,150 295,155" fill="#FFFFFF" />

    <!-- Back Peak (Left) -->
    <polygon points="190,125 285,270 115,270" fill="url(#peakGradLeft)" opacity="0.85" />
    <polygon points="190,125 115,270 170,270" fill="#0F2D4E" opacity="0.5" />
    <!-- Back Peak Snowcap Left -->
    <polygon points="190,125 215,165 200,175 180,160 165,168" fill="#FFFFFF" />

    <!-- Center Grand Peak -->
    <polygon points="256,80 365,260 256,260" fill="url(#peakGradMid)" />
    <polygon points="256,80 147,260 256,260" fill="url(#peakGradLeft)" />
    <!-- Center Snowcap Geometry -->
    <polygon points="256,80 295,145 275,158 256,140 237,158 217,145" fill="#FFFFFF" />
    <polygon points="256,80 275,158 256,140" fill="#DDF2FF" />
  </g>

  <!-- ISOMETRIC DIGITAL BALLOT BOX (Centerpiece, Tech & Security) -->
  <g id="ballot-box" transform="translate(0, 10)">
    <!-- Ballot Box Isometric Top Face -->
    <polygon points="256,220 346,270 256,320 166,270" fill="url(#boxTop)" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- Ballot Slot on Top -->
    <polygon points="256,252 292,272 256,292 220,272" fill="#07172B" />
    
    <!-- Cast Ballot Paper Entering Slot -->
    <g id="ballot-card">
      <polygon points="256,195 292,215 256,235 220,215" fill="#FFFFFF" opacity="0.95" />
      <polygon points="256,205 292,225 256,245 220,225" fill="#E2F1FF" />
      
      <!-- Saffron / Orange Checkmark on the ballot -->
      <path d="M 242 216 L 252 226 L 274 204" stroke="#FF7700" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Ballot Box Left Isometric Face -->
    <polygon points="166,270 256,320 256,410 166,360" fill="url(#boxLeft)" stroke="#1E3A5F" stroke-width="1" />
    
    <!-- Ballot Box Right Isometric Face -->
    <polygon points="256,320 346,270 346,360 256,410" fill="url(#boxRight)" stroke="#1E3A5F" stroke-width="1" />

    <!-- Circuit Inlays on the Box Faces -->
    <path d="M 195 325 L 225 342 L 225 375" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <circle cx="225" cy="375" r="3" fill="#00E5FF" opacity="0.8" />
    
    <path d="M 317 325 L 287 342 L 287 375" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <circle cx="287" cy="375" r="3" fill="#00E5FF" opacity="0.8" />

    <!-- Central Verification Shield Indicator -->
    <polygon points="256,335 272,344 272,365 256,375 240,365 240,344" fill="#00D2FF" opacity="0.25" />
    <path d="M 248 355 L 254 361 L 265 350" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- SLEEK INDIAN TRICOLOR RIBBON CURVES SWEEPING AT THE BASE -->
  <g id="tricolor-ribbon" opacity="0.95">
    <!-- Saffron Ribbon Curve -->
    <path d="M 90 415 C 160 385, 350 380, 422 415" stroke="url(#saffronGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" filter="url(#softGlow)" opacity="0.9" />
    <path d="M 90 415 C 160 385, 350 380, 422 415" stroke="url(#saffronGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- White Ribbon Curve -->
    <path d="M 105 430 C 175 402, 335 398, 407 430" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- India Green Ribbon Curve -->
    <path d="M 120 445 C 190 418, 320 415, 392 445" stroke="url(#greenGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" filter="url(#softGlow)" opacity="0.8" />
    <path d="M 120 445 C 190 418, 320 415, 392 445" stroke="url(#greenGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>
</svg>