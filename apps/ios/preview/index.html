<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>HimVote : Campus Elections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0C0A09; --charcoal:#1C1917; --grey:#78716C; --stone:#A8A29E;
  --cream:#FAF8F5; --orange:#C2410C; --orange-d:#9A3412; --orange-v:#EA580C;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  --font-head:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  /* Light theme */
  --bg:#FAF8F5; --surface:#FFFFFF; --surface-2:#F5F2EB; --text:#1C1917; --muted:#78716C;
  --line:#E7E5E4; --field:#FFFFFF; --field-line:#A8A29E;
  --accent:#C2410C; --accent-d:#9A3412; --on-accent:#FAF8F5;
  --btn-d-bg:#1C1917; --btn-d-fg:#FAF8F5;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(255,255,255,.75); --glass-shadow:0 12px 32px rgba(12,10,9,.16);
  --dock-ink:#78716C; --dock-on:#C2410C; --dock-active:rgba(194,65,12,.12);
  --scrim:rgba(12,10,9,.42); --sheet:rgba(250,248,245,.80);
}
:root[data-theme=dark]{
  --bg:#0C0A09; --surface:#1C1917; --surface-2:#292524; --text:#FAF8F5; --muted:#A8A29E;
  --line:#292524; --field:#1C1917; --field-line:#78716C;
  --accent:#EA580C; --accent-d:#C2410C; --on-accent:#FAF8F5;
  --btn-d-bg:#FAF8F5; --btn-d-fg:#1C1917;
  --glass:rgba(168,162,158,.16); --glass-line:rgba(250,248,245,.14); --glass-shadow:0 12px 32px rgba(0,0,0,.55);
  --dock-ink:#A8A29E; --dock-on:#EA580C; --dock-active:rgba(234,88,12,.18);
  --scrim:rgba(0,0,0,.62); --sheet:rgba(28,25,23,.78);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--black);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
button{font-family:inherit;cursor:pointer}
.topbar{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;color:var(--stone);font-size:12px}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--cream);font-family:var(--font-head)}
.topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--orange-v)}
.topbar .tools{display:flex;gap:8px}
.topbar a,.topbar button{height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--charcoal);background:var(--charcoal);color:var(--cream);font-size:12px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
.device{position:relative;width:100%;max-width:400px;height:min(844px,calc(100vh - 72px));background:var(--bg);color:var(--text);border-radius:48px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 10px var(--charcoal),0 0 0 11px #292524;transition:background .25s,color .25s}
.device.flat{border-radius:0;max-width:640px;box-shadow:none}
.statusbar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 24px 0;font-size:14px;font-weight:600;color:var(--text);font-family:var(--font-head)}
.statusbar #clock{width:56px}
.island{width:96px;height:26px;border-radius:999px;background:var(--black)}
.sb-btn{width:56px;height:30px;border:0;background:none;color:var(--text);display:flex;align-items:center;justify-content:flex-end}
.sb-btn svg{width:20px;height:20px}
#screen{flex:1;overflow-y:auto;padding:4px 16px 128px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
/* Type */
.head{padding:8px 0 18px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.h1{font-family:var(--font-head);font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.label-sm{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.tint{background:var(--surface-2);border-color:var(--surface-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px}
.stat b{display:block;font-family:var(--font-head);font-size:24px;font-weight:800;letter-spacing:-.03em}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.grow{flex:1;min-width:0}
.t{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.s{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;line-height:1.4}
.meta{font-size:12px;color:var(--muted);margin:8px 0 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;flex:none}
.b-orange{background:var(--accent);color:var(--on-accent)}
.b-dark{background:var(--btn-d-bg);color:var(--btn-d-fg)}
.b-line{border:1px solid var(--stone);color:var(--muted)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-size:14px;font-weight:600;width:100%;transition:background .15s,opacity .15s,transform .1s;letter-spacing:-.005em}
.btn:active{transform:scale(.985);opacity:.9}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-p:hover{background:var(--accent-d)}
.btn-d{background:var(--btn-d-bg);color:var(--btn-d-fg)}
.btn-g{background:transparent;border-color:var(--field-line);color:var(--text)}
.btn-o{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn-sm{height:34px;padding:0 14px;font-size:12px;width:auto;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600}
.field .opt{color:var(--muted);font-weight:500}
input,select{height:48px;padding:0 14px;border:1px solid var(--field-line);border-radius:14px;background:var(--field);font-size:14px;color:var(--text);font-family:inherit;width:100%;outline:none;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(194,65,12,.2)}
input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--accent)}
input::placeholder{color:var(--grey)}
input:disabled{opacity:.6}
.err{font-size:11px;color:var(--accent);font-weight:600}
.err:empty{display:none}
.hint{font-size:11px;color:var(--muted);line-height:1.4}
.pw{position:relative}
.pw input{padding-right:48px}
.pw button{position:absolute;right:5px;top:5px;width:38px;height:38px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pw button svg{width:18px;height:18px}
.meter{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--stone);transition:width .2s}
.meter i.ok{background:var(--accent)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:11px;color:var(--muted);margin-top:6px}
.rules .ok{color:var(--accent);font-weight:600}
.notice{padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--text)}
.notice.warn{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.notice:empty{display:none}
/* Segmented */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);padding:3px;border-radius:12px;gap:2px}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tabs button{height:36px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:13px;color:var(--muted)}
.tabs .on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(12,10,9,.18)}
/* Auth */
.auth{padding-top:12px}
.auth-head{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.link{background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;text-align:center;padding:8px}
.link.o{color:var(--accent)}
/* Logo (PNG replaceable) */
.logo{position:relative;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);overflow:hidden;flex:none}
.logo svg{width:50%;height:50%}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.logo.has-img{background:transparent}
.logo.has-img svg{display:none}
.logo.has-img img{opacity:1}
/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--cream);overflow:hidden;flex:none;font-family:var(--font-head)}
.avatar img{width:100%;height:100%;object-fit:cover}
.swatches{display:flex;gap:10px;align-items:center}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--stone)}
.swatch.on{box-shadow:0 0 0 2px var(--accent)}
/* Results */
.res{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.res-row .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;gap:8px}
.res-row .bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.res-row .bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
/* Empty */
.empty{text-align:center;padding:24px 12px;font-size:13px;color:var(--muted);line-height:1.5}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.empty svg{width:28px;height:28px;margin:0 auto 8px;display:block;color:var(--stone)}
/* Floating dock: translucent iOS glass */
#dock{position:absolute;left:14px;right:14px;bottom:20px;height:68px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-line);display:flex;align-items:stretch;padding:6px;gap:2px;z-index:20;box-shadow:var(--glass-shadow)}
#dock.hidden{display:none}
#dock button{flex:1;min-width:0;border:0;background:transparent;color:var(--dock-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:22px;font-size:10px;font-weight:600;transition:background .15s,color .15s}
#dock button svg{width:22px;height:22px}
#dock button.on{color:var(--dock-on);background:var(--dock-active)}
/* Sheet + toast */
.modal-bg{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;background:var(--sheet);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);border-top:1px solid var(--glass-line);border-radius:28px 28px 0 0;padding:10px 16px 26px;max-height:90%;overflow-y:auto}
.sheet .grab{width:36px;height:5px;border-radius:5px;background:var(--stone);opacity:.7;margin:0 auto 14px}
.sheet h3{font-family:var(--font-head);font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sheet p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.choice{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-size:14px}
.choice:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice input{width:18px;height:18px;accent-color:var(--accent);flex:none}
#toast{position:absolute;top:54px;left:16px;right:16px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);color:var(--text);padding:12px 14px;border-radius:16px;font-size:13px;font-weight:500;z-index:70;opacity:0;transform:translateY(-8px);transition:all .2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
@media (max-width:520px){
  body{padding:0;gap:0}
  .topbar{display:none}
  .device{max-width:none;height:100dvh;border-radius:0;box-shadow:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span>HimVote : Campus Elections</div>
  <div class="tools">
    <a href="HimVote.ipa" download="HimVote.ipa">.IPA</a>
    <button type="button" id="frame-btn" onclick="toggleFrame()">Frame</button>
  </div>
</div>

<div id="device" class="device">
  <div class="statusbar"><span id="clock">9:41</span><div class="island"></div><button type="button" id="theme-btn" class="sb-btn" data-act="theme-cycle" aria-label="Switch between light and dark mode"></button></div>
  <main id="screen" tabindex="-1"></main>
  <nav id="dock" aria-label="Primary"></nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => (document.getElementById(id)?.value ?? '');
const fmt = ts => new Date(ts).toLocaleString([], {dateStyle:'medium', timeStyle:'short'});
const short = h => h && h.length > 18 ? h.slice(0,10) + '…' + h.slice(-6) : (h || '');
const DEPTS = ['Computer Science','Mechanical Engineering','Electronics & Communication','Business Administration','School of Law','Humanities & Social Sciences'];
const deptLabel = d => d === 'All' ? 'All departments' : d;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const PHONE_RE = /^\+[1-9]\d{7,14}$/;
const ROLL_RE = /^[A-Za-z0-9-]{4,20}$/;

const ICONS = {
  home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  shield:'M12 3l7 3v5c0 4.7-3 8-7 10-4-2-7-5.3-7-10V6z|M9 12l2 2 4-4',
  ballot:'M4 5h16v14H4z|M8 9h8M8 13h5',
  users:'M16 20v-1.5a4.5 4.5 0 0 0-4.5-4.5h-3A4.5 4.5 0 0 0 4 18.5V20|M10 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6z|M17 11a3 3 0 0 0 0-6|M17 14h.5a3.5 3.5 0 0 1 3.5 3.5V20',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z|M4 21a8 8 0 0 1 16 0',
  calendar:'M4 6h16v14H4z|M4 10h16|M8 3v4M16 3v4',
  flag:'M5 21V4|M5 4h12l-2 4 2 4H5',
  list:'M6 4h12v16H6z|M9 8h6M9 12h6M9 16h3',
  receipt:'M6 4h12v16l-3-2-3 2-3-2-3 2z|M9 8h6M9 12h6',
  chart:'M4 20V4|M4 20h16|M8 16v-5M12 16V8M16 16v-3',
  trash:'M4 7h16|M10 11v6M14 11v6|M6 7l1 13h10l1-13|M9 7V4h6v3',
  eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z|M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  eyeoff:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z|M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z|M4 4l16 16',
  plus:'M12 5v14M5 12h14',
  logout:'M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4|M10 16l-4-4 4-4|M6 12h10',
  copy:'M9 9h10v11H9z|M5 15V4h10',
  inbox:'M3 13l3-8h12l3 8v6H3z|M3 13h5l1 3h6l1-3h5',
  sun:'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z|M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
  moon:'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'
};
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${(ICONS[n]||'').split('|').map(d=>`<path d="${d}"/>`).join('')}</svg>`;

/* ================= CRYPTO ================= */
const enc = s => new TextEncoder().encode(s);
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
const randHex = n => hex(crypto.getRandomValues(new Uint8Array(n)));
const HAS_SUBTLE = !!(window.crypto && crypto.subtle);

function sha256js(str){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));
  const bytes=enc(str), primes=[];
  for(let n=2;primes.length<64;n++){ if(primes.every(p=>n%p)) primes.push(n); }
  const K=primes.map(p=>Math.floor((Math.cbrt(p)%1)*4294967296));
  let H=primes.slice(0,8).map(p=>Math.floor((Math.sqrt(p)%1)*4294967296));
  const l=bytes.length, total=((l+9+63)>>6)<<6, buf=new Uint8Array(total);
  buf.set(bytes); buf[l]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(total-4,(l*8)>>>0); dv.setUint32(total-8,Math.floor(l*8/4294967296));
  const w=new Uint32Array(64);
  for(let o=0;o<total;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){
      const a=w[i-15], b=w[i-2];
      const s0=rr(a,7)^rr(a,18)^(a>>>3), s1=rr(b,17)^rr(b,19)^(b>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[i]+w[i])>>>0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    const old=H; H=[a,b,c,d,e,f,g,h].map((v,i)=>(old[i]+v)>>>0);
  }
  return H.map(v=>v.toString(16).padStart(8,'0')).join('');
}
async function sha256(str){
  if(HAS_SUBTLE) return hex(await crypto.subtle.digest('SHA-256', enc(str)));
  return sha256js(str);
}
async function hashPw(pw, salt){
  if(HAS_SUBTLE){
    const key = await crypto.subtle.importKey('raw', enc(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc(salt), iterations:150000, hash:'SHA-256'}, key, 256);
    return hex(bits);
  }
  let h = pw + salt;
  for(let i=0;i<3000;i++) h = sha256js(h);
  return h;
}
async function merkleRoot(leaves){
  if(!leaves.length) return '';
  let lvl = leaves.slice();
  while(lvl.length > 1){
    const nxt = [];
    for(let i=0;i<lvl.length;i+=2) nxt.push(await sha256(lvl[i] + (lvl[i+1] || lvl[i])));
    lvl = nxt;
  }
  return lvl[0];
}

/* Password policy */
const PW_RULES = [
  ['10+ characters', p => p.length >= 10],
  ['Lowercase letter', p => /[a-z]/.test(p)],
  ['Uppercase letter', p => /[A-Z]/.test(p)],
  ['A number', p => /\d/.test(p)],
  ['A symbol', p => /[^A-Za-z0-9]/.test(p)]
];
const pwOk = p => PW_RULES.every(([,f]) => f(p));
function pwRulesHtml(p){
  const passed = PW_RULES.filter(([,f]) => f(p)).length;
  return `<div class="meter"><i class="${passed===PW_RULES.length?'ok':''}" style="width:${passed/PW_RULES.length*100}%"></i></div>
    <div class="rules">${PW_RULES.map(([l,f]) => `<span class="${f(p)?'ok':''}">${f(p)?'✓':'○'} ${l}</span>`).join('')}</div>`;
}

const forms = {};
let lockInfo = JSON.parse(localStorage.getItem('himvote_lock') || '{"n":0,"until":0}');
const saveLock = () => localStorage.setItem('himvote_lock', JSON.stringify(lockInfo));

forms.signin = async () => {
  const email = val('si-email').trim().toLowerCase(), pw = val('si-pw');
  const msg = $('#si-msg'); msg.textContent = '';
  let ok = setErr('si-email', !email ? 'Enter your email.' : !EMAIL_RE.test(email) ? 'Enter a valid email address.' : '');
  ok = setErr('si-pw', !pw ? 'Enter your password.' : '') && ok;
  if(!ok) return;
  const wait = lockInfo.until - Date.now();
  if(wait > 0){ msg.textContent = `Too many failed attempts. Try again in ${Math.ceil(wait/1000)} seconds.`; return; }
  const btn = $('#si-btn'); btn.disabled = true; btn.textContent = 'Signing in…';
  const u = db.users.find(x => x.email === email);
  const good = u ? (await hashPw(pw, u.salt)) === u.hash : (await hashPw(pw, 'unknown-user-salt'), false);
  btn.disabled = false; btn.textContent = 'Sign in';
  if(!good){
    lockInfo.n++; if(lockInfo.n % 5 === 0) lockInfo.until = Date.now() + 30000 * (lockInfo.n / 5); saveLock();
    msg.textContent = lockInfo.until > Date.now() ? `Too many failed attempts. Try again in ${Math.ceil((lockInfo.until-Date.now())/1000)} seconds.` : 'Invalid email or password.';
    $('#si-pw').value = '';
    return;
  }
  lockInfo = {n:0, until:0}; saveLock();
  setSession(u); noteActivity(); log('Signed in', u.email);
  route = defaultRoute(u); render(); toast(`Welcome, ${nameOf(u)}.`);
};

async function validateNewAccount(prefix, email){
  const pw = val(prefix + '-pw'), pw2 = val(prefix + '-pw2');
  let ok = true;
  const local = email.split('@')[0];
  ok = setErr(prefix + '-pw', !pw ? 'Create a password.' : !pwOk(pw) ? 'Password does not meet every requirement.' : (local.length >= 4 && pw.toLowerCase().includes(local.toLowerCase())) ? 'Password must not contain your email name.' : '') && ok;
  ok = setErr(prefix + '-pw2', !pw2 ? 'Confirm your password.' : pw !== pw2 ? 'Passwords do not match.' : '') && ok;
  return ok;
}
const emailTaken = email => db.users.some(u => u.email === email);
function checkName(id){ const n = val(id).trim().replace(/\s+/g,' '); return setErr(id, !n ? 'Enter your full name.' : n.length < 2 ? 'Name is too short.' : n.length > 80 ? 'Name is too long.' : ''); }
function checkEmail(id){ const e = val(id).trim().toLowerCase(); return setErr(id, !e ? 'Enter an email address.' : !EMAIL_RE.test(e) ? 'Enter a valid email address.' : emailTaken(e) ? 'That email is already in use.' : ''); }

async function createUser(base, pw){
  const salt = randHex(16);
  const u = Object.assign({id:'u_' + randHex(6), salt, hash: await hashPw(pw, salt), created: Date.now(), displayName:null, phone:null, avatar:null, avatarColor:'orange'}, base);
  db.users.push(u); save(); return u;
}

  const r = db.receipts.find(x => x.rid === id);

  if(!r || !b){ out.innerHTML = `<div class="notice warn">No ballot with this receipt was found in the ledger.</div>`; return; }
  const e = db.elections.find(x => x.id === r.eid);
  const root = await merkleRoot(db.ballots.filter(x => x.eid === r.eid).sort((a,c)=>a.idx-c.idx).map(x => x.leaf));
  out.innerHTML = `<div class="notice"><b>Included in ledger.</b><br>${esc(e ? e.title : 'Election')} · Leaf #${r.idx}<br><span class="mono">Leaf ${esc(short(r.leaf))}<br>Root ${esc(short(root))}</span></div>`;

forms.profile = () => {
  const u = me(), p = readProfile();
  if(!p.ok) return;
  u.displayName = p.name || null; u.phone = p.phone || null; save();
  log('Profile updated'); render(); toast('Profile updated.');
};
function readProfile(){
  const u = me(), raw = val('pf-name'), name = raw.trim().replace(/\s+/g,' '), phone = val('pf-phone').trim();
  let ok = setErr('pf-name', raw.length && !name ? 'Display name cannot be only spaces.' : name.length > 80 ? 'Display name cannot exceed 80 characters.' : '');
  ok = setErr('pf-phone', phone && !PHONE_RE.test(phone) ? 'Use E.164 format, e.g. +14155552671.' : '') && ok;
  const dirty = name !== (u.displayName || '') || phone !== (u.phone || '');
  return {ok, dirty, name, phone};
}

forms['change-pw'] = async () => {
  const u = me(), old = val('cp-old'), nw = val('cp-new'), nw2 = val('cp-new2');
  let ok = true;
  if(!old) ok = setErr('cp-old', 'Enter your current password.') && false; else setErr('cp-old','');
  ok = setErr('cp-new', !nw ? 'Enter a new password.' : !pwOk(nw) ? 'Password does not meet every requirement.' : nw === old ? 'Choose a password you have not used just now.' : '') && ok;
  ok = setErr('cp-new2', !nw2 ? 'Confirm your new password.' : nw !== nw2 ? 'Passwords do not match.' : '') && ok;
  if(!ok) return;
  if((await hashPw(old, u.salt)) !== u.hash){ setErr('cp-old', 'Current password is incorrect.'); return; }
  u.salt = randHex(16); u.hash = await hashPw(nw, u.salt); u.mustChange = false; save();
  log('Password changed'); render(); toast('Password updated.');
};

/* ================= ACTIONS ================= */
const acts = {};
acts.go = t => go(t.dataset.to);
acts['go-auth'] = t => { authMode = t.dataset.m; route = 'auth'; render(); };
acts['auth-mode'] = t => { authMode = t.dataset.m; render(); };
acts.togglepw = t => {
  const i = document.getElementById(t.dataset.target); if(!i) return;
  const show = i.type === 'password'; i.type = show ? 'text' : 'password'; t.innerHTML = ico(show ? 'eyeoff' : 'eye');
};
acts.signout = () => signOut();
function signOut(){ const u = me(); if(u) log('Signed out', u.email); setSession(null); route = 'home'; closeSheet(); render(); }
acts['close-sheet'] = closeSheet;
acts['sheet-bg'] = (t, e) => { if(e.target === t) closeSheet(); };
acts['confirm-ok'] = () => { const cb = confirmCb; confirmCb = null; closeSheet(); if(cb) cb(); };
acts.copy = async t => { try{ await navigator.clipboard.writeText(t.dataset.v); toast('Copied to clipboard.'); }catch(e){ toast('Copy is not available here.'); } };

acts['run-integrity'] = () => {
  integrity = {ts:Date.now(), rows: db.elections.filter(e => e.status !== 'DRAFT').map(e => {
    const bs = db.ballots.filter(b => b.eid === e.id), b = bs.length, v = votedCount(e), r = db.receipts.filter(x => x.eid === e.id).length;
    const unique = new Set(bs.map(x => x.leaf)).size === b;
    return {title:e.title, b, v, r, ok: b === v && unique && r <= b};
  })};
  log('Integrity check run'); render();
};

acts['del-admin'] = t => {
  const a = db.users.find(u => u.id === t.dataset.id); if(!a) return;
  confirmSheet('Delete administrator?', `${a.email} will lose access immediately. Elections they created are kept.`, 'Delete', () => {
    db.users = db.users.filter(u => u.id !== a.id); log(`Administrator deleted: ${a.email}`); render(); toast('Administrator deleted.');
  });
};
acts['del-election'] = t => {
  const e = db.elections.find(x => x.id === t.dataset.id); if(!e) return;
  const n = db.ballots.filter(b => b.eid === e.id).length;
  confirmSheet('Delete election?', `“${e.title}” will be removed${n ? `, including ${n} accepted ballot${n===1?'':'s'} and their receipts` : ''}. This cannot be undone.`, 'Delete', () => {
    db.elections = db.elections.filter(x => x.id !== e.id);
    db.ballots = db.ballots.filter(b => b.eid !== e.id);
    db.receipts = db.receipts.filter(r => r.eid !== e.id);
    delete db.voted[e.id]; db.requests = db.requests.filter(r => r.eid !== e.id);
    log(`Election deleted: ${e.title}`); render(); toast('Election deleted.');
  });
};
acts['election-next'] = t => {
  const e = db.elections.find(x => x.id === t.dataset.id), to = t.dataset.to; if(!e) return;
  if(to === 'OPEN' && e.candidates.length < 2){ toast('Add at least two candidates before opening.'); return; }
  e.status = to; log(`Election ${to.toLowerCase()}: ${e.title}`); render(); toast(`Election is now ${to.toLowerCase()}.`);
};
acts['req-approve'] = t => {
  if(me()?.role !== 'SuperUser') return;
  const r = db.requests.find(x => x.id === t.dataset.id && x.status === 'PENDING'); if(!r) return;
  const e = db.elections.find(x => x.id === r.eid), st = db.users.find(x => x.id === r.uid);
  if(!e || !st || e.status !== 'DRAFT' || e.candidates.some(c => c.uid === st.id)){ r.status = 'REJECTED'; log('Nomination request closed (no longer valid)'); render(); toast('That request is no longer valid and was closed.'); return; }
  e.candidates.push({id:'c_' + randHex(4), uid:st.id, name:st.name});
  r.status = 'APPROVED'; log(`Nomination approved: ${st.name} for ${e.title}`); render(); toast(`${st.name} is now a candidate.`);
};
acts['req-reject'] = t => {
  if(me()?.role !== 'SuperUser') return;
  const r = db.requests.find(x => x.id === t.dataset.id && x.status === 'PENDING'); if(!r) return;
  r.status = 'REJECTED'; const st = db.users.find(x => x.id === r.uid);
  log(`Nomination rejected: ${st ? st.name : 'student'}`); render(); toast('Request rejected.');
};
acts['rem-cand'] = t => {
  if(me()?.role !== 'SuperUser') return;
  const e = db.elections.find(x => x.id === t.dataset.eid); if(!e || e.status !== 'DRAFT') return;
  const c = e.candidates.find(x => x.id === t.dataset.cid); if(!c) return;
  e.candidates = e.candidates.filter(x => x.id !== c.id); log(`Candidate removed: ${c.name} from ${e.title}`); render(); toast('Candidate removed.');
};
acts['del-student'] = t => {
  const s = db.users.find(u => u.id === t.dataset.id); if(!s) return;
  if(db.elections.some(e => e.status !== 'DRAFT' && e.candidates.some(c => c.uid === s.id))){ toast('This student is a candidate in an open or finished election.'); return; }
  confirmSheet('Delete student?', `${s.name} (${s.rollNo}) will be removed from the roster along with their receipts. Their accepted ballots stay in the ledger.`, 'Delete', () => {
    removeUser(s.id); log(`Student deleted: ${s.email}`); render(); toast('Student deleted.');
  });
};
function removeUser(id){
  db.users = db.users.filter(u => u.id !== id);
  db.receipts = db.receipts.filter(r => r.uid !== id);
  db.requests = db.requests.filter(r => r.uid !== id);
  db.elections.forEach(e => { if(e.status === 'DRAFT') e.candidates = e.candidates.filter(c => c.uid !== id); });
}
acts['del-receipt'] = t => {
  confirmSheet('Remove receipt?', 'This removes the receipt from your account on this device. Your ballot stays counted.', 'Remove', () => {
    db.receipts = db.receipts.filter(r => r.rid !== t.dataset.id); save(); render(); toast('Receipt removed.');
  });
};

/* Voting */
let casting = false;
acts['open-booth'] = t => {
  const e = db.elections.find(x => x.id === t.dataset.id); if(!e) return;
  openSheet(`<h3>${esc(e.title)}</h3><p>${esc(e.office)}. Choose one candidate. Your choice is not shown on your account.</p>
    <div class="stack-sm">${e.candidates.map((c,i) => `<label class="choice"><input type="radio" name="cand" value="${c.id}"><span>${esc(c.name)}</span></label>`).join('')}</div>
    <div class="err" id="booth-err" style="margin:8px 0"></div>
    <div class="two" style="margin-top:8px"><button class="btn btn-g" data-act="close-sheet">Cancel</button><button class="btn btn-p" data-act="cast" data-id="${e.id}" id="cast-btn">Cast ballot</button></div>`);
};
acts.cast = async t => {
  if(casting) return;
  const u = me(), e = db.elections.find(x => x.id === t.dataset.id), sel = document.querySelector('input[name=cand]:checked');
  if(!sel){ $('#booth-err').textContent = 'Select a candidate to continue.'; return; }
  if(!e || e.status !== 'OPEN' || !eligible(e, u)){ closeSheet(); toast('This election is not open to you.'); render(); return; }
  db.voted[e.id] = db.voted[e.id] || [];
  if(db.voted[e.id].includes(u.id)){ log('Duplicate ballot attempt rejected', 'Voter (anonymous)'); closeSheet(); toast('You have already voted in this election.'); return; }
  casting = true; $('#cast-btn').disabled = true;
  try{
    const idx = db.ballots.filter(b => b.eid === e.id).length + 1;
    const leaf = await sha256(`${e.id}|${idx}|${randHex(16)}`);
    const rid = 'rcpt_' + randHex(6), ts = Date.now();
    db.ballots.push({eid:e.id, idx, leaf, cid:sel.value, ts});
    db.voted[e.id].push(u.id);
    db.receipts.push({rid, uid:u.id, eid:e.id, idx, leaf, ts});
    log(`Ballot accepted in ${e.title}`, 'Voter (anonymous)');
    render();
    openSheet(`<h3>Ballot accepted</h3><p>Keep this receipt. It proves inclusion without revealing your choice.</p>
      <div class="card tint stack-sm"><div class="label-sm">Receipt ID</div><div class="mono">${esc(rid)}</div><div class="label-sm" style="margin-top:6px">Ledger position</div><div class="mono">Leaf #${idx}</div></div>
      <div class="two" style="margin-top:12px"><button class="btn btn-g" data-act="copy" data-v="${rid}">Copy ID</button><button class="btn btn-p" data-act="close-sheet">Done</button></div>`);
  } finally { casting = false; }
};

/* Avatar */
acts['theme-cycle'] = () => { setTheme(effectiveTheme() === 'dark' ? 'light' : 'dark'); if(route === 'account') render(); };
acts['theme-set'] = t => { setTheme(t.dataset.v); render(); };
acts['logo-pick'] = () => { const f = $('#logo-file'); if(f) f.click(); };
acts['logo-reset'] = () => { if(me()?.role !== 'SuperUser') return; delete db.settings.logo; log('Logo reset'); render(); toast('Logo reset to default.'); };
document.addEventListener('change', e => {
  if(e.target.id !== 'logo-file' || me()?.role !== 'SuperUser') return;
  const file = e.target.files && e.target.files[0]; if(!file) return;
  if(file.type !== 'image/png'){ toast('Please choose a PNG file.'); return; }
  if(file.size > 3 * 1024 * 1024){ toast('Logo must be under 3 MB.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 256, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      db.settings.logo = c.toDataURL('image/png'); log('Logo updated'); render(); toast('Logo updated.');
    };
    img.onerror = () => toast('That image could not be read.');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});
acts['avatar-pick'] = () => $('#avatar-file').click();
acts['avatar-remove'] = () => { const u = me(); u.avatar = null; save(); render(); toast('Photo removed.'); };
acts['avatar-color'] = t => { const u = me(); u.avatarColor = t.dataset.c; save(); render(); };
document.addEventListener('change', e => {
  if(e.target.id !== 'avatar-file') return;
  const file = e.target.files && e.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Please choose an image file.'); return; }
  if(file.size > 8 * 1024 * 1024){ toast('Image must be under 8 MB.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.width, img.height), ctx = c.getContext('2d');
      ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, s, s);
      const u = me(); u.avatar = c.toDataURL('image/jpeg', .82); save(); render(); toast('Photo updated.');
    };
    img.onerror = () => toast('That image could not be read.');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

/* Delete own account */
acts['del-account'] = () => {
  openSheet(`<h3>Delete your account?</h3><p>This permanently removes your account and receipts from this device. Enter your password to confirm.</p>
    <div class="field"><div class="pw"><input id="da-pw" type="password" placeholder="Password" autocomplete="current-password"><button type="button" data-act="togglepw" data-target="da-pw" aria-label="Show or hide password">${ico('eye')}</button></div><div class="err" id="e-da-pw"></div></div>
    <div class="two" style="margin-top:12px"><button class="btn btn-g" data-act="close-sheet">Cancel</button><button class="btn btn-p" data-act="del-account-do">Delete account</button></div>`);
};
acts['del-account-do'] = async () => {
  const u = me(), pw = val('da-pw');
  if(!setErr('da-pw', !pw ? 'Enter your password.' : '')) return;
  if((await hashPw(pw, u.salt)) !== u.hash){ setErr('da-pw', 'Incorrect password.'); return; }
  if(u.role === 'Student' && db.elections.some(e => e.status !== 'DRAFT' && e.candidates.some(c => c.uid === u.id))){ setErr('da-pw', 'You are a candidate in an open or finished election.'); return; }
  log(`Account deleted: ${u.email}`, u.email);
  removeUser(u.id); save(); setSession(null); closeSheet(); route = 'home'; render(); toast('Your account was deleted.');
};

/* ================= LIVE HANDLERS ================= */
const lives = {
  pw: t => { const box = document.getElementById('rules-' + t.id); if(box) box.innerHTML = pwRulesHtml(t.value); },
  profile: () => { const p = readProfile(); $('#pf-save').disabled = !(p.ok && p.dirty); },
  'roster-search': t => {
    const q = t.value.trim().toLowerCase();
    const list = scopedStudents(me()).filter(s => !q || [s.name, s.rollNo, s.email, s.dept].some(v => v.toLowerCase().includes(q)));
    $('#roster-list').innerHTML = rosterHtml(list); $('#roster-count').textContent = list.length;
  },
  'cand-election': () => fillCandidateStudents()
};

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  noteActivity();
  const t = e.target.closest('[data-act]'); if(!t) return;
  const f = acts[t.dataset.act]; if(f) f(t, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault(); const h = forms[f.dataset.form]; if(h) h(f);
});
['input','change'].forEach(ev => document.addEventListener(ev, e => {
  const l = e.target.dataset && e.target.dataset.live;
  if(l && lives[l]) lives[l](e.target);
}));
const _render = render;
render = function(){ _render(); if(route === 'ad-candidates' || route === 'su-candidates') fillCandidateStudents(); };

/* ================= DEVICE CHROME ================= */
function tick(){ const d = new Date(); $('#clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
setInterval(tick, 15000); tick();
function toggleFrame(){ $('#device').classList.toggle('flat'); }

/* Initial Super User setup is reachable only through himvote.html#setup, so it never appears in the student-facing UI. */
function checkHash(){
  if(location.hash === '#setup' && !hasSuperUser() && !me()){ authMode = 'setup'; route = 'auth'; render(); }
}
window.addEventListener('hashchange', checkHash);
/* The Super User exists from the first launch. Change the default password after signing in. */
const SEED_EMAIL = 'superuser@campus.edu', SEED_PW = 'Super@Himvote2026';
async function seedSuperUser(){
  if(hasSuperUser()) return;
  const salt = randHex(16);
  db.users.push({id:'u_super', role:'SuperUser', name:'Super User', email:SEED_EMAIL, salt, hash: await hashPw(SEED_PW, salt), created:Date.now(), displayName:null, phone:null, avatar:null, avatarColor:'charcoal', dept:'All', mustChange:true});
  save();
}
applyTheme();
seedSuperUser().then(() => { render(); checkHash(); });
</script>
