[build-system]
requires = ["setuptools"]
build_backend = "setuptools.build_meta"

[project]
name = "himvote_checkpoint_worker"
version = "1.0.0"
description = "HimVote Merkle log publisher and checkpoint worker"
readme = "README.md"
requires_python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.2",
    "cryptography>=42.0.8",
    "httpx>=0.27.0",
    "python_dotenv>=1.0.1",
    "psycopg2_binary>=2.9.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
