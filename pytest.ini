[pytest]
pythonpath =
    .
    services/checkpoint_worker
    packages/himvote_crypto
    witness
addopts = --import-mode=importlib
testpaths =
    tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    gate_e1: Gate E1 voting engine verification
    q7: Core integrity tests from Section 12
    governance: Role and approval governance tests
