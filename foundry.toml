[profile.default]
src = "chain/contracts"
out = "chain/out"
test = "chain/test"
script = "chain/script"
libs = ["chain/lib", "lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
